name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2
          python -m pip install -r requirements.txt
          python -m pip install pip-audit==2.10.1

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Compile Python files
        run: python -m compileall .

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Smoke test Streamlit app
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file("app.py")
          at.run(timeout=30)
          if at.exception:
              raise SystemExit([str(error.value) for error in at.exception])
          PY

      - name: Generate portfolio assets
        run: python scripts/generate_portfolio_assets.py
